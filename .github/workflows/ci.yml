name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check every source file
        run: find src tests -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Test suite
        run: npm test

  design:
    name: design rules hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      # The central claim of the language is a claim, so it gets verified rather
      # than asserted. A seventh borrowed keyword fails the build.
      - name: No borrowed structural keyword
        run: node tests/keywords.js

      # SPEC.md's word list is generated from the grammar. Editing one without
      # the other makes the spec wrong about the language it specifies.
      - name: Spec and grammar agree
        run: node tests/spec-sync.js
